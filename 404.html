  <script>
  async function requestAudio() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      console.log("麦克风已授权");

      mediaRecorder = new MediaRecorder(stream);
      mediaRecorder.start();
    } catch (err) {
      console.error("授权失败:", err);

  }
